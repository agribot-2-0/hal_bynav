image: docker:18-git

pipelines:
  default:
    - step:
        name: "Check cppcheck"
        script:
          - apk add --update bash coreutils tar cppcheck
          - git submodule update --init --recursive
          - cppcheck agribot_*
    - step:
        name: "Check cpplint"
        script:
          - apk add --update bash coreutils tar python3 py3-pip
          - pip3 install cpplint==1.4.6
          - git submodule update --init --recursive
          - cpplint --recursive agribot_*
    - step:
        name: "ROS build"
        size: 2x
        services:
          - docker
        script:
          - apk add --update bash coreutils tar
          - git submodule update --init --recursive
          - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci -b master
          - git clone https://github.com/panpawelchmiel/agribot_common.git
          - .industrial_ci/bitbucket.sh BUILDER="colcon" ROS_DISTRO="melodic" UPSTREAM_WORKSPACE="agribot_common"

definitions:
  services:
    docker:
      memory: 7128
